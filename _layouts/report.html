<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffaf3;
      --text: #1f2933;
      --muted: #5f6b75;
      --accent: #0f766e;
      --border: rgba(31, 41, 51, 0.12);
      --shadow: 0 18px 40px rgba(31, 41, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(214, 158, 46, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .topbar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .topbar a:hover,
    .topbar a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .card {
      background: rgba(255, 250, 243, 0.96);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 28px 28px 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.78rem;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
    }

    .content {
      padding: 20px 28px 32px;
      overflow-x: auto;
    }

    .content h2,
    .content h3 {
      margin-top: 1.8em;
      line-height: 1.2;
    }

    .content p,
    .content li,
    .content td,
    .content th {
      font-size: 1rem;
      line-height: 1.7;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      background: rgba(255, 255, 255, 0.72);
    }

    .content th,
    .content td {
      border: 1px solid rgba(31, 41, 51, 0.12);
      padding: 0.7rem 0.8rem;
      vertical-align: top;
    }

    .content th {
      background: rgba(15, 118, 110, 0.08);
      text-align: left;
    }

    .content img {
      max-width: 100%;
      height: auto;
    }

    .content blockquote {
      margin: 1rem 0;
      padding: 0.25rem 1rem;
      border-left: 4px solid rgba(15, 118, 110, 0.35);
      background: rgba(15, 118, 110, 0.04);
    }

    @media (max-width: 640px) {
      .shell {
        padding: 16px 12px 40px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .header,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a href="{{ '/' | relative_url }}">Back to index</a>
      <span>{{ site.title }}</span>
    </div>

    <article class="card">
      <header class="header">
        <p class="eyebrow">{{ page.company | default: "Company report" }}</p>
        <h1>{{ page.title | default: site.title }}</h1>
      </header>
      <div class="content">
        {{ content }}
      </div>
    </article>
  </main>
</body>
</html>
